<script>
// t: 주제, lv: 난이도, q: 문제, code: 문제 코드, c: 보기 4개, a: 정답 번호(0~3), ex: 해설, exCode: 해설 코드 → 결과
const Q = [
  // ───────── MSSQL ─────────
  { id: 'S1', t: 'MSSQL', lv: '하', q: 'Customer에 A, B, C 3명이 있고 Quote는 A가 2건, B가 1건, C는 0건이다. 결과는 몇 줄일까?',
    code: 'SELECT c.Name, q.Id\nFROM Customer c\nLEFT JOIN Quote q ON q.CustomerId = c.Id;',
    c: ['2줄', '3줄', '4줄', '6줄'], a: 2,
    ex: 'LEFT JOIN은 왼쪽(Customer)을 전부 남긴다. A 2줄 + B 1줄 + 견적 없는 C도 1줄(q.Id는 NULL) = 4줄. INNER JOIN이었다면 C가 빠져서 3줄.',
    exCode: 'Name | Id\n-----+-----\nA    | 1\nA    | 2\nB    | 3\nC    | NULL   ← 짝이 없어도 남는다' },
  { id: 'S2', t: 'MSSQL', lv: '하', q: '"견적이 2건 이상인 거래처만" 보려면 빈칸에 무엇이 들어갈까?',
    code: 'SELECT CustomerId, COUNT(*) AS Cnt\nFROM Quote\nGROUP BY CustomerId\n____ COUNT(*) >= 2;',
    c: ['WHERE', 'HAVING', 'ON', 'FILTER'], a: 1,
    ex: 'WHERE는 묶기 전에 줄을 거르고, HAVING은 GROUP BY로 묶은 뒤 그룹을 거른다. COUNT(*) 같은 집계 결과는 묶은 뒤에야 생기므로 HAVING.' },
  { id: 'S3', t: 'MSSQL', lv: '하', q: 'Memo 칸이 NULL인 견적이 3건 있다. 이 쿼리는 몇 줄을 돌려줄까?',
    code: 'SELECT * FROM Quote WHERE Memo = NULL;',
    c: ['3줄', '0줄', '전체 줄', '문법 에러'], a: 1,
    ex: 'NULL은 "값이 없음"이라 = 로 비교하면 참도 거짓도 아닌 "모름"이 되어 한 줄도 안 나온다. NULL은 IS NULL로 찾는다.',
    exCode: 'SELECT * FROM Quote WHERE Memo = NULL;    → 0줄\nSELECT * FROM Quote WHERE Memo IS NULL;   → 3줄' },
  { id: 'S4', t: 'MSSQL', lv: '하', q: 'MySQL의 LIMIT 10처럼 "위에서 10건만" 가져오는 MSSQL 문법은?',
    c: ['SELECT * FROM Quote LIMIT 10', 'SELECT * FROM Quote ROWNUM <= 10', 'SELECT FIRST 10 * FROM Quote', 'SELECT TOP 10 * FROM Quote'], a: 3,
    ex: 'MSSQL에는 LIMIT이 없다. TOP n을 SELECT 바로 뒤에 쓴다. 페이지 넘기기는 ORDER BY ... OFFSET 20 ROWS FETCH NEXT 10 ROWS ONLY.' },
  { id: 'S5', t: 'MSSQL', lv: '중', q: 'Price 칸에 10, NULL, 30 세 줄이 있다. 결과는?',
    code: 'SELECT COUNT(*) AS A, COUNT(Price) AS B FROM Product;',
    c: ['A=3, B=3', 'A=2, B=2', 'A=3, B=2', 'A=2, B=3'], a: 2,
    ex: 'COUNT(*)는 줄 수를 세고, COUNT(칸)은 그 칸이 NULL이 아닌 줄만 센다. SUM, AVG도 NULL은 건너뛴다(AVG = 40 / 2 = 20).' },
  { id: 'S6', t: 'MSSQL', lv: '중', q: '이 쿼리를 실행하면?',
    code: 'SELECT CustomerId, Status, COUNT(*)\nFROM Quote\nGROUP BY CustomerId;',
    c: ['거래처별 건수가 나온다', 'Status는 NULL로 나온다', 'Status는 첫 줄 값이 나온다', '에러가 난다'], a: 3,
    ex: '거래처 하나에 Status가 여러 개일 수 있는데 한 줄로 묶었으니 어떤 Status를 보여줄지 정할 수 없다. SELECT에 쓴 칸은 GROUP BY에 있거나 집계 함수 안에 있어야 한다.',
    exCode: "Msg 8120: Column 'Quote.Status' is invalid in the select list because it is not\ncontained in either an aggregate function or the GROUP BY clause." },
  { id: 'S7', t: 'MSSQL', lv: '중', q: 'WITH로 시작하는 CTE는 무엇일까?',
    code: "WITH OpenQuote AS (\n    SELECT * FROM Quote WHERE Status = 'Open'\n)\nSELECT CustomerId, COUNT(*) FROM OpenQuote GROUP BY CustomerId;",
    c: ['DB에 저장되는 새 테이블', '바로 뒤 쿼리 한 문장에서만 쓰는, 이름 붙인 임시 결과', '인덱스의 한 종류', '트랜잭션을 여는 명령'], a: 1,
    ex: 'CTE는 서브쿼리에 이름을 붙여 위로 빼낸 것이다. 그 문장이 끝나면 사라진다. 긴 쿼리를 단계별로 읽히게 만들 때 쓴다.' },
  { id: 'S8', t: 'MSSQL', lv: '중', q: 'Quote에 (A사, 11-10), (A사, 11-12), (B사, 11-10) 세 줄이 있다. A사 11-10 줄의 rn 값은?',
    code: 'SELECT CustomerName, CreatedAt,\n       ROW_NUMBER() OVER (PARTITION BY CustomerName ORDER BY CreatedAt DESC) AS rn\nFROM Quote;',
    c: ['1', '2', '3', 'NULL'], a: 1,
    ex: 'PARTITION BY는 줄을 합치지 않고 그룹만 나눈다. 그룹 안에서 ORDER BY 순서대로 1번부터 번호를 매긴다. A사는 최신(11-12)이 1, 그다음(11-10)이 2. 여기에 WHERE rn = 1을 걸면 "거래처별 최신 1건"이 된다.',
    exCode: 'CustomerName | CreatedAt | rn\n-------------+-----------+---\nA사          | 11-12     | 1\nA사          | 11-10     | 2\nB사          | 11-10     | 1' },
  { id: 'S9', t: 'MSSQL', lv: '중', q: 'Id=1 상품의 Stock이 10이었다. 마지막 SELECT의 결과는?',
    code: 'BEGIN TRAN;\nUPDATE Product SET Stock = Stock - 3 WHERE Id = 1;\nROLLBACK;\nSELECT Stock FROM Product WHERE Id = 1;',
    c: ['7', '10', 'NULL', '에러'], a: 1,
    ex: 'BEGIN TRAN부터 한 일은 COMMIT 해야 확정된다. ROLLBACK은 전부 없던 일로 되돌린다. "견적 → 주문 전환"에서 재고 차감은 됐는데 주문 생성이 실패했을 때 재고를 되돌리려고 쓴다.' },
  { id: 'S10', t: 'MSSQL', lv: '중', q: 'QuoteItem.QuoteId가 Quote(Id)를 참조하는 FK다. Quote에 없는 999번으로 INSERT하면?',
    code: 'INSERT INTO QuoteItem (QuoteId, ProductId, Qty) VALUES (999, 1, 5);',
    c: ['들어가고 QuoteId만 NULL이 된다', '들어가고 Quote에 999번이 자동 생성된다', 'FK 제약 위반 에러로 거부된다', '경고만 뜨고 들어간다'], a: 2,
    ex: 'FK는 "부모 없는 자식 줄"을 DB가 막아주는 규칙이다. 주인 없는 견적 품목이 생기지 않는다.',
    exCode: 'Msg 547: The INSERT statement conflicted with the FOREIGN KEY constraint "FK__QuoteItem__Quote...".' },
  { id: 'S11', t: 'MSSQL', lv: '중', q: 'Product에 Price가 있는데도 QuoteItem에 UnitPrice 칸을 따로 두는 이유는?',
    code: 'CREATE TABLE QuoteItem (\n    Id        INT IDENTITY(1,1) PRIMARY KEY,\n    QuoteId   INT NOT NULL,\n    ProductId INT NOT NULL,\n    Qty       INT NOT NULL,\n    UnitPrice DECIMAL(10, 2) NOT NULL\n);',
    c: ['JOIN을 줄여 조회를 빠르게 하려고', '나중에 상품 가격이 바뀌어도 견적 당시 금액이 그대로 남아야 해서', 'FK를 안 쓰려고', '특별한 이유 없는 중복이라 지워야 한다'], a: 1,
    ex: '정규화는 "같은 사실을 두 번 저장하지 않기"다. 그런데 "상품의 현재 가격"과 "그 견적에서 합의한 단가"는 서로 다른 사실이다. Product.Price를 올려도 이미 보낸 견적서 금액이 바뀌면 안 된다.' },
  { id: 'S12', t: 'MSSQL', lv: '중', q: 'MSSQL에서 PRIMARY KEY를 만들면 기본으로 함께 생기는 것은?',
    c: ['클러스터드 인덱스', '트리거', '뷰', '아무것도 안 생긴다'], a: 0,
    ex: '클러스터드 인덱스는 테이블의 줄 자체를 그 칸 순서로 정렬해 저장하는 방식이라 테이블당 1개뿐이다. 그래서 WHERE Id = 5가 빠르다. 다른 칸으로 찾는 조회를 빠르게 하려면 논클러스터드 인덱스를 따로 만든다.',
    exCode: 'CREATE INDEX IX_Quote_CreatedAt ON Quote (CreatedAt);   ← 논클러스터드 인덱스' },
  { id: 'S13', t: 'MSSQL', lv: '중', q: 'CreatedAt에 인덱스가 있다. 11월 견적을 찾을 때 그 인덱스를 제대로 타는(Index Seek) 조건은?',
    c: ['WHERE YEAR(CreatedAt) = 2026 AND MONTH(CreatedAt) = 11',
        "WHERE CONVERT(VARCHAR(7), CreatedAt, 120) = '2026-11'",
        "WHERE CreatedAt >= '2026-11-01' AND CreatedAt < '2026-12-01'",
        "WHERE DATEDIFF(MONTH, CreatedAt, '2026-11-01') = 0"], a: 2,
    ex: '인덱스는 칸의 원래 값 순서로 정렬돼 있다. 칸을 함수로 감싸면 모든 줄을 계산해 봐야 해서 전체를 훑는다(Scan). 칸은 그대로 두고 비교할 값 쪽을 맞춰야 한다. 쿼리 최적화 면접의 단골 질문이다.' },
  { id: 'S14', t: 'MSSQL', lv: '중', q: 'Name에 인덱스가 있다. 인덱스로 바로 찾아갈 수 있는 조건은?',
    c: ["WHERE Name LIKE '%마스크'", "WHERE Name LIKE '%마스크%'", "WHERE Name LIKE '마스크%'", '셋 다 똑같이 빠르다'], a: 2,
    ex: "인덱스는 사전처럼 앞 글자 순서로 정렬돼 있다. '마스크%'는 사전에서 '마스크'로 시작하는 곳을 바로 펼 수 있지만, '%마스크'는 앞 글자를 몰라서 전부 읽어야 한다." },
  { id: 'S15', t: 'MSSQL', lv: '중', q: '인덱스를 칸마다 많이 만들면 생기는 문제는?',
    c: ['SELECT가 느려진다', 'INSERT / UPDATE / DELETE가 느려지고 저장 공간이 늘어난다', 'JOIN을 쓸 수 없게 된다', '문제 없다. 많을수록 좋다'], a: 1,
    ex: '줄을 넣거나 고칠 때마다 인덱스도 전부 같이 고쳐야 한다. 인덱스는 "읽기를 빠르게 하는 대신 쓰기 비용을 내는" 거래라서, 자주 조회하는 조건에만 만든다.' },
  { id: 'S16', t: 'MSSQL', lv: '중', q: '이 C# 코드의 문제는?',
    code: 'var sql = "SELECT * FROM Product WHERE Name = \'" + input + "\'";',
    c: ['느리다', '한글이 깨진다', '입력값에 SQL을 섞어 넣을 수 있다(SQL 인젝션)', '문제 없다'], a: 2,
    ex: "input에 ' OR 1=1 -- 를 넣으면 조건이 무력화되어 전체 줄이 나온다. 값은 문자열로 이어 붙이지 말고 파라미터로 넘긴다.",
    exCode: 'var sql = "SELECT * FROM Product WHERE Name = @name";\ncmd.Parameters.AddWithValue("@name", input);' },
  { id: 'S17', t: 'MSSQL', lv: '상', q: '트랜잭션 1은 A를 잠그고 B를 기다리고, 트랜잭션 2는 B를 잠그고 A를 기다린다. SQL Server는 어떻게 할까?',
    c: ['둘 다 영원히 기다린다', '둘 다 롤백한다', '하나를 골라 롤백시키고 나머지를 진행시킨다', '서버가 재시작된다'], a: 2,
    ex: '이 상태가 데드락(교착)이다. SQL Server가 감지해서 한쪽을 희생자로 골라 롤백한다. 예방법은 모든 코드가 테이블을 같은 순서로 건드리고, 트랜잭션을 짧게 유지하는 것.',
    exCode: 'Msg 1205: Transaction (Process ID 55) was deadlocked on lock resources with another\nprocess and has been chosen as the deadlock victim. Rerun the transaction.' },

  // ───────── C# ─────────
  { id: 'C1', t: 'C#', lv: '하', q: 'a의 값은?', code: 'int a = 5 / 2;',
    c: ['2.5', '2', '3', '컴파일 에러'], a: 1,
    ex: 'int끼리 나누면 결과도 int라서 소수점 아래를 버린다. 2.5가 필요하면 한쪽을 소수 타입으로 쓴다.',
    exCode: 'int a = 5 / 2;         → 2\ndecimal b = 5m / 2;    → 2.5' },
  { id: 'C2', t: 'C#', lv: '하', q: '이 코드는?', code: 'var x = 10;\nx = "hello";',
    c: ['x가 "hello"가 된다', '실행 중에 예외가 난다', '컴파일 에러가 난다', 'x가 0이 된다'], a: 2,
    ex: 'var는 "타입을 생략해도 컴파일러가 정해준다"는 뜻이지 "아무 타입이나 된다"가 아니다. x는 첫 줄에서 int로 굳는다. JavaScript의 let과 다르다.',
    exCode: "error CS0029: Cannot implicitly convert type 'string' to 'int'" },
  { id: 'C3', t: 'C#', lv: '하', q: '금액(단가, 합계)을 담을 타입으로 맞는 것은?',
    c: ['float', 'double', 'int', 'decimal'], a: 3,
    ex: 'double은 근사값이라 0.1 + 0.2가 정확히 0.3이 아니다. decimal은 10진수 그대로 계산한다. MSSQL의 DECIMAL(10, 2)와 짝이다.',
    exCode: '0.1 + 0.2 == 0.3       → False   (double)\n0.1m + 0.2m == 0.3m    → True    (decimal)' },
  { id: 'C4', t: 'C#', lv: '하', q: 'len의 값은?', code: 'string? name = null;\nint len = name?.Length ?? 0;',
    c: ['0', 'null', 'NullReferenceException 발생', '컴파일 에러'], a: 0,
    ex: '?. 는 "null이면 멈추고 null을 돌려준다", ?? 는 "왼쪽이 null이면 오른쪽 값을 쓴다". 그냥 name.Length라고 쓰면 NullReferenceException이 난다.' },
  { id: 'C5', t: 'C#', lv: '중', q: 'Product는 class다. 마지막 줄의 a.Price는?',
    code: 'var a = new Product { Price = 100 };\nvar b = a;\nb.Price = 200;\nConsole.WriteLine(a.Price);',
    c: ['100', '200', '0', '컴파일 에러'], a: 1,
    ex: 'class는 참조 타입이라 b = a는 복사가 아니라 같은 객체를 둘이 가리키게 한다. int, decimal, struct 같은 값 타입은 대입할 때 값이 복사된다.' },
  { id: 'C6', t: 'C#', lv: '중', q: '이 속성의 의미는?', code: 'public decimal Price { get; private set; }',
    c: ['어디서든 읽고 쓸 수 있다', '어디서도 읽을 수 없다', '밖에서는 읽기만, 값 변경은 클래스 안에서만', '한 번 정하면 클래스 안에서도 못 바꾼다'], a: 2,
    ex: 'get은 읽기, set은 쓰기. set 앞에 private을 붙이면 밖에서 product.Price = -1처럼 마음대로 바꾸지 못하고, 클래스의 메서드를 거쳐야 한다.' },
  { id: 'C7', t: 'C#', lv: '중', q: 'result에 들어 있는 값은?',
    code: 'var nums = new[] { 1, 2, 3, 4 };\nvar result = nums.Where(x => x % 2 == 0).Select(x => x * 10);',
    c: ['10, 20, 30, 40', '2, 4', '20, 40', '10, 30'], a: 2,
    ex: 'Where는 조건에 맞는 것만 남기고(JavaScript의 filter), Select는 각각을 바꾼다(map). 짝수 2, 4만 남기고 10을 곱한다. 이 문법이 LINQ다.' },
  { id: 'C8', t: 'C#', lv: '중', q: 'quotes가 빈 리스트일 때 두 줄의 결과는?',
    code: 'var a = quotes.First();\nvar b = quotes.FirstOrDefault();',
    c: ['둘 다 null', '둘 다 예외', 'a는 null, b는 예외', 'a는 예외, b는 null'], a: 3,
    ex: 'First()는 "반드시 있다"는 뜻이라 없으면 예외를 던진다. FirstOrDefault()는 없으면 기본값(class면 null)을 준다. "없을 수 있는 조회"에는 FirstOrDefault를 쓰고 null을 확인한다.',
    exCode: 'System.InvalidOperationException: Sequence contains no elements' },
  { id: 'C9', t: 'C#', lv: '중', q: 'GetQuoteAsync가 async Task<Quote>를 돌려준다. await 없이 받은 q의 타입은?',
    code: 'var q = GetQuoteAsync(1);',
    c: ['Quote', 'Task<Quote>', 'null', 'void'], a: 1,
    ex: 'Task<Quote>는 "나중에 Quote를 줄게"라는 약속이다(JavaScript의 Promise). await를 붙여야 끝날 때까지 기다렸다가 Quote를 꺼낸다.',
    exCode: 'var q = await GetQuoteAsync(1);   ← q는 Quote' },
  { id: 'C10', t: 'C#', lv: '중', q: 'ASP.NET Core에서 이 등록의 의미는?', code: 'builder.Services.AddScoped<QuoteService>();',
    c: ['앱 전체에서 인스턴스 하나를 공유', '쓸 때마다 매번 새로 생성', '웹 요청 한 번 동안 같은 인스턴스를 사용', '서비스를 삭제'], a: 2,
    ex: '의존성 주입(DI) 수명 세 가지: AddSingleton은 앱 전체에 하나, AddScoped는 요청 하나당 하나, AddTransient는 받을 때마다 새로. DB 연결(DbContext)은 보통 Scoped다. Blazor Server에서는 "요청" 대신 사용자 접속(회로) 하나당 하나가 된다.' },
  { id: 'C11', t: 'C#', lv: '중', q: 'EF Core에서 SQL이 DB로 실제 전송되는 시점은?',
    code: 'var query = db.Quotes.Where(q => q.Status == "Open");   // ①\nvar list  = query.ToList();                             // ②',
    c: ['①', '②', '둘 다', '둘 다 아니다'], a: 1,
    ex: '①은 "이런 조건으로 찾겠다"는 계획만 만든다. ToList(), First(), Count()처럼 결과가 실제로 필요한 순간에 SQL이 나간다. 그래서 Where를 여러 번 이어 붙여도 SQL은 한 번이다.' },

// 문제별 개념 설명: [무엇인지·왜 쓰는지, 코드 → 결과]. 풀기 전에 "개념 먼저 보기"로 펼친다.
const K = {
  S1: ['JOIN은 표 두 개를 옆으로 붙이는 것이다. ON 뒤에 "어느 칸이 같으면 짝인지"를 적는다.\n• INNER JOIN: 짝이 있는 줄만 남긴다.\n• LEFT JOIN: 왼쪽 표의 줄은 짝이 없어도 남기고, 오른쪽 칸은 NULL(빈칸)로 채운다.',
       '-- Customer: (1, 가), (2, 나)   Quote: (Id 7, CustomerId 1)\nSELECT c.Name, q.Id FROM Customer c INNER JOIN Quote q ON q.CustomerId = c.Id;\n→ 가 | 7                 (1줄: 나는 짝이 없어 빠짐)\n\nSELECT c.Name, q.Id FROM Customer c LEFT JOIN Quote q ON q.CustomerId = c.Id;\n→ 가 | 7\n   나 | NULL              (2줄: 나도 남음)'],
  S2: ['GROUP BY는 같은 값을 가진 줄들을 한 줄로 묶는다. 묶은 뒤에는 COUNT(*) 같은 집계 함수로 "그룹당 몇 줄인지"를 구할 수 있다.\nSQL은 적힌 순서가 아니라 이 순서로 처리된다:\nFROM(표 고르기) → WHERE(줄 거르기) → GROUP BY(묶기) → HAVING(그룹 거르기) → SELECT(보여주기)',
       "-- Quote의 CustomerId: 1, 1, 2\nSELECT CustomerId, COUNT(*) AS Cnt FROM Quote GROUP BY CustomerId;\n→ 1 | 2\n   2 | 1"],
  S3: ['NULL은 0도 아니고 빈 글자도 아닌 "값을 모름 / 없음"이라는 표시다.\n모르는 값과 무엇을 비교하면 결과도 "모름"이 된다. WHERE는 결과가 "참"인 줄만 통과시킨다.',
       "SELECT 1 WHERE 5 = 5;        → 1줄   (참)\nSELECT 1 WHERE 5 = 6;        → 0줄   (거짓)\nSELECT 1 WHERE NULL = NULL;  → 0줄   (모름: 참이 아니다)"],
  S4: ['SQL은 공통 표준이 있지만 DB 제품(MySQL, MSSQL, Oracle …)마다 문법이 조금씩 다르다. "몇 건만 가져오기"가 대표적으로 다른 부분이다.\nMySQL은 문장 맨 끝에 LIMIT을 붙이고, MSSQL은 SELECT 바로 뒤에 키워드를 붙인다.',
       '-- MySQL\nSELECT * FROM Quote ORDER BY Id DESC LIMIT 3;'],
  S5: ['집계 함수는 여러 줄을 값 하나로 줄인다: COUNT(개수), SUM(합), AVG(평균), MAX, MIN.\n괄호 안에 칸 이름을 쓰면 "그 칸에 값이 있는 줄"만 계산 대상이 된다. NULL은 값이 없다는 뜻이다.',
       '-- Stock: 5, NULL\nSELECT SUM(Stock) FROM Product;   → 5      (NULL은 건너뜀)\nSELECT AVG(Stock) FROM Product;   → 5      (5 / 1, 2로 나누지 않음)'],
  S6: ['GROUP BY를 하면 결과는 "그룹당 한 줄"이 된다. 한 줄의 한 칸에는 값이 하나만 들어갈 수 있다.\n그래서 SELECT에 쓸 수 있는 것은 두 가지뿐이다: ① 묶는 기준 칸 ② 집계 함수(값 하나로 줄여 주는 것).',
       "-- Quote: (CustomerId 1, 'Open'), (CustomerId 1, 'Ordered')\nSELECT CustomerId, COUNT(*)    FROM Quote GROUP BY CustomerId;   → 1 | 2\nSELECT CustomerId, MAX(Status) FROM Quote GROUP BY CustomerId;   → 1 | Ordered"],
  S7: ['쿼리 안에 쿼리를 넣은 것을 서브쿼리라고 한다. 쓸 수는 있지만 안쪽부터 읽어야 해서 길어지면 읽기 어렵다.\nWITH는 그 안쪽 쿼리를 위로 꺼내 이름을 붙이는 문법이다. 결과는 같다.',
       "-- 서브쿼리로 쓴 것\nSELECT COUNT(*) FROM (SELECT * FROM Quote WHERE Status = 'Open') AS OpenQuote;\n\n-- WITH로 쓴 것 (같은 결과)\nWITH OpenQuote AS (SELECT * FROM Quote WHERE Status = 'Open')\nSELECT COUNT(*) FROM OpenQuote;"],
  S8: ['GROUP BY는 줄을 합쳐서 줄 수가 줄어든다. 윈도우 함수는 줄을 그대로 둔 채 옆에 계산 칸을 하나 붙인다.\n모양: 함수() OVER (PARTITION BY 그룹 칸 ORDER BY 순서 칸)\n• PARTITION BY: 어느 줄끼리 한 그룹인지\n• ORDER BY: 그룹 안에서의 순서\n• ROW_NUMBER(): 그 순서대로 1, 2, 3 … 번호를 매긴다. 그룹이 바뀌면 다시 1부터.',
       "-- Sale: (가게 X, 100), (가게 X, 300), (가게 Y, 200)\nSELECT Shop, Amount,\n       ROW_NUMBER() OVER (PARTITION BY Shop ORDER BY Amount DESC) AS rn\nFROM Sale;\n→ X | 300 | 1\n   X | 100 | 2\n   Y | 200 | 1"],
  S9: ['트랜잭션은 명령 여러 개를 "전부 되거나, 전부 안 되거나" 한 묶음으로 만드는 것이다.\n• BEGIN TRAN: 묶음 시작\n• COMMIT: 지금까지 한 일을 확정\n• ROLLBACK: 지금까지 한 일을 전부 취소\n예: 계좌 이체에서 내 돈은 빠졌는데 상대 계좌에 넣다 실패하면, 뺀 것도 취소돼야 한다.',
       '-- Stock = 10\nBEGIN TRAN;\nUPDATE Product SET Stock = Stock - 3 WHERE Id = 1;\nCOMMIT;\nSELECT Stock FROM Product WHERE Id = 1;   → 7   (확정됨)'],
  S10: ['PK(기본 키)는 줄 하나를 가리키는 번호다(Quote.Id). FK(외래 키)는 "다른 표의 PK를 가리키는 칸"이다.\nFK를 걸면 DB가 규칙을 지킨다: 이 칸에는 저쪽 표에 실제로 있는 번호만 들어갈 수 있다.',
       '-- Quote에 Id 1만 있음\nINSERT INTO QuoteItem (QuoteId, ProductId, Qty) VALUES (1, 1, 5);\n→ (1 row affected)   ← 1번 견적이 실제로 있으니 통과'],
  S11: ['정규화는 "같은 사실은 한 곳에만 저장한다"는 설계 원칙이다. 상품 이름을 품목 줄마다 복사해 두면 이름이 바뀔 때 전부 고쳐야 하고, 하나라도 빠지면 데이터가 서로 어긋난다. 그래서 ProductId만 두고 이름은 JOIN으로 가져온다.\n다만 판단 기준은 "글자가 같은가"가 아니라 "같은 사실인가"다. 시점이 다르면 다른 사실일 수 있다.',
       '-- 이름은 복사하지 않고 필요할 때 붙인다\nSELECT p.Name, i.Qty\nFROM QuoteItem i JOIN Product p ON p.Id = i.ProductId;'],
  S12: ['인덱스는 책 뒤의 "찾아보기"다. 없으면 표를 처음부터 끝까지 읽어야 하고(Scan), 있으면 해당 위치로 바로 간다(Seek).\n종류는 둘이다.\n• 클러스터드: 표의 줄 자체를 그 칸 순서로 정렬해 저장한다. 줄을 두 가지 순서로 동시에 정렬할 수는 없으니 표당 1개.\n• 논클러스터드: 표와 별도로 만든 찾아보기. 여러 개 만들 수 있다.',
       'SELECT * FROM Quote WHERE Id = 5;            → Id 순서로 정렬돼 있으면 바로 찾는다\nSELECT * FROM Quote WHERE CustomerId = 3;    → CustomerId 인덱스가 없으면 전체를 읽는다'],
  S13: ['인덱스는 그 칸의 "원래 값" 순서로 정렬된 목록이다. 조건이 원래 값 그대로를 비교하면 정렬 순서를 이용해 바로 찾는다(Seek).\n칸을 함수나 계산으로 감싸면, 감싼 결과는 정렬돼 있지 않으므로 모든 줄을 하나씩 계산해 봐야 한다(Scan).',
       '-- Price에 인덱스가 있을 때\nWHERE Price = 100         → Seek  (칸 그대로)\nWHERE Price * 2 = 200     → Scan  (칸을 계산으로 감쌈. 결과는 같아도 느리다)'],
  S14: ["LIKE는 글자 패턴으로 찾는다. %는 \"아무 글자가 0개 이상\"이라는 뜻이다.\n• '김%' : 김으로 시작\n• '%김' : 김으로 끝남\n• '%김%': 김이 들어감\n글자 칸의 인덱스는 국어사전처럼 앞 글자부터 순서대로 정렬돼 있다. 사전에서 어떤 단어를 바로 펼 수 있는지 떠올려 보자.",
       "-- Name: 김철수, 박김수, 이김\nSELECT Name FROM Customer WHERE Name LIKE '김%';   → 김철수\nSELECT Name FROM Customer WHERE Name LIKE '%김';   → 이김"],
  S15: ['논클러스터드 인덱스는 표와 별도로 저장되는 "정렬된 사본"이다(찾을 칸 + 원래 줄의 위치).\n책 본문을 고치면 찾아보기의 쪽 번호도 고쳐야 하듯, 표의 줄이 바뀌면 그 표에 걸린 모든 인덱스도 같이 고쳐진다.',
       'CREATE INDEX IX_Product_Name  ON Product (Name);\nCREATE INDEX IX_Product_Price ON Product (Price);\n-- 이제 INSERT 한 번에 표 + 인덱스 2개, 총 3군데를 쓴다'],
  S16: ['C#은 SQL을 "글자(문자열)"로 만들어 DB에 보낸다. DB는 받은 글자 전체를 명령으로 해석한다.\n사용자가 입력한 글자를 그 문자열에 그대로 이어 붙이면, 입력 내용도 명령의 일부가 된다.',
       "input = 마스크\n→ SELECT * FROM Product WHERE Name = '마스크'              (의도한 대로)\n\ninput = ' OR 1=1 --\n→ SELECT * FROM Product WHERE Name = '' OR 1=1 --'        (조건이 항상 참이 된다)"],
  S17: ['트랜잭션이 어떤 줄을 고치면 끝날 때(COMMIT/ROLLBACK)까지 그 줄에 락(잠금)이 걸린다. 다른 트랜잭션이 같은 줄을 고치려면 락이 풀릴 때까지 기다린다. 두 사람이 같은 재고를 동시에 깎아 숫자가 꼬이는 걸 막기 위해서다.\n보통은 잠깐 기다리면 끝난다. 그런데 둘이 서로 상대가 가진 락을 기다리면 어떻게 될까?',
       '-- 창 1                              -- 창 2\nBEGIN TRAN;\nUPDATE Product SET Stock = 9\n WHERE Id = 1;                      UPDATE Product SET Stock = 8 WHERE Id = 1;\n                                    → 멈춰서 기다림\nCOMMIT;                             → 이제 실행됨'],

  C1: ['C#은 변수마다 타입이 정해져 있다. int는 정수만, decimal과 double은 소수까지 담는다.\n계산 결과의 타입은 재료의 타입을 따라간다. 정수와 정수를 계산하면 결과도 정수다.',
       'int a = 7 / 2;          → 3      (정수 ÷ 정수 = 정수, 나머지는 버림)\ndouble b = 7.0 / 2;     → 3.5    (한쪽이 소수면 결과도 소수)\nint c = 7 % 2;          → 1      (%는 나머지)'],
  C2: ['C#은 실행하기 전에 컴파일러가 코드 전체의 타입을 검사한다(정적 타입). 타입이 안 맞으면 실행조차 되지 않는다.\nvar는 "오른쪽 값을 보고 타입을 대신 적어 달라"는 줄임말일 뿐이다.',

  C3: ['소수를 담는 타입은 셋이다.\n• float, double: 컴퓨터 내부에서 2진수로 저장한다. 0.1 같은 수는 2진수로 딱 떨어지지 않아 아주 조금 어긋난 근사값이 된다. 빠르다.\n• decimal: 10진수 그대로 저장해 정확하다. 숫자 뒤에 m을 붙여 쓴다.',
       'double d = 0.1 + 0.2;      → 0.30000000000000004\ndecimal m = 0.1m + 0.2m;   → 0.3'],
  C4: ['null은 "가리키는 객체가 없음"이다. null인 변수에 점(.)을 찍어 무언가를 꺼내려 하면 프로그램이 예외로 멈춘다.\n• string? 의 ? : 이 변수는 null일 수 있다는 표시\n• a?.b : a가 null이면 꺼내지 않고 null을 돌려준다\n• x ?? y : x가 null이면 y를 쓴다',
       'string? s = null;\ns.Length          → NullReferenceException (프로그램 중단)\ns?.Length         → null\ns ?? "없음"       → "없음"'],
  C5: ['타입은 두 부류로 나뉜다.\n• 값 타입(int, decimal, bool, struct): 변수에 값 자체가 들어 있다. 대입하면 값이 복사된다.\n• 참조 타입(class, string, 배열, List): 변수에는 객체가 있는 "위치"가 들어 있다. 대입하면 위치가 복사되어 둘이 같은 객체를 가리킨다.',
       'int a = 1;\nint b = a;\nb = 2;\nConsole.WriteLine(a);   → 1   (int는 값이 복사됐으니 a는 그대로)'],
  C6: ['속성(property)은 객체의 값을 밖에 내보이는 창구다. { get; set; }에서 get은 읽기, set은 쓰기다.\n앞에 붙는 public / private은 "누가 쓸 수 있나"를 정한다: public은 어디서나, private은 그 클래스 안에서만.',
       'class Product {\n    public string Name { get; set; }\n}\nvar p = new Product();\np.Name = "마스크";         // set (쓰기)\nConsole.WriteLine(p.Name); // get (읽기) → 마스크'],
  C7: ['x => x * 2 는 이름 없는 짧은 함수다(람다). "x를 받아서 x * 2를 돌려준다"로 읽는다.\nLINQ는 배열이나 List에 이런 함수를 넘겨 걸러내고 바꾸는 메서드 모음이다. SQL의 WHERE, SELECT와 같은 역할이다.',
       'var nums = new[] { 1, 2, 3 };\nnums.Where(x => x > 1)      → 2, 3      (조건이 참인 것만)\nnums.Select(x => x + 100)   → 101, 102, 103   (하나씩 바꿈)\nnums.Count()                → 3'],
  C8: ['예외(Exception)는 실행 중에 "계속할 수 없는 상황"이 생겼다는 신호다. try/catch로 처리하지 않으면 프로그램이 멈춘다.\nLINQ 메서드 이름에 OrDefault가 붙으면 "없을 때 예외 대신 기본값을 준다"는 뜻이다. 기본값은 class면 null, int면 0이다.',
       'var nums = new List<int> { 5, 6 };\nnums.First()             → 5\nnums.FirstOrDefault()    → 5      (값이 있을 때는 둘이 같다)'],
  C9: ['DB 조회나 네트워크 요청은 오래 걸린다. 비동기(async) 메서드는 일을 시작만 해 두고 바로 "약속"을 돌려준다. 이 약속의 타입이 Task다.\n• Task<int>: 나중에 int를 주겠다는 약속\n• await: 약속이 끝날 때까지 기다렸다가 안의 값을 꺼낸다(기다리는 동안 서버는 다른 요청을 처리한다)',
       'async Task<int> GetCountAsync() { ... }\n\nint n = await GetCountAsync();    // await가 Task<int>에서 int를 꺼낸다'],
  C10: ['의존성 주입(DI)은 필요한 객체를 내가 new로 만들지 않고, 미리 "등록"해 두면 프레임워크가 만들어서 넣어 주는 방식이다.\n등록할 때 그 객체를 얼마나 오래 재사용할지(수명)를 메서드 이름으로 정한다. 수명은 세 가지가 있다: 앱 전체에 하나 / 요청 하나당 하나 / 받을 때마다 새로.',
       '// Program.cs: 등록\nbuilder.Services.AddSingleton<Clock>();     // 앱 전체에 하나\nbuilder.Services.AddTransient<Mailer>();    // 받을 때마다 새로\n\n// 받는 쪽: 생성자에 적으면 알아서 들어온다\nclass QuoteService(Clock clock) { }'],
  C11: ['EF Core는 C# 코드를 SQL로 번역해 주는 도구다(ORM). db.Quotes가 Quote 표이고, Where는 SQL의 WHERE로 번역된다.\nWhere를 호출하면 결과가 아니라 "아직 실행하지 않은 쿼리"가 돌아온다. 그래서 조건을 계속 이어 붙일 수 있다.',
       'var q = db.Quotes.Where(x => x.Status == "Open");\nq = q.Where(x => x.CustomerId == 3);      // 조건 추가. 아직 "계획"일 뿐\n\n-- 나중에 번역되는 SQL은 한 문장\nSELECT * FROM Quote WHERE Status = \'Open\' AND CustomerId = 3'],
  C12: ['EF Core는 DB에서 꺼내 준 객체를 기억하고 있다가 어떤 값이 바뀌었는지 추적한다(변경 추적).\n객체의 값을 바꾸는 것과 그 변경을 DB에 보내는 것은 별개의 단계다. 보내는 명령은 따로 있다.',
       'db.Products.Add(new Product { Name = "마스크" });   // 메모리에만 추가됨\ndb.SaveChanges();                                  // 이때 INSERT가 DB로 나간다'],

  B1: ['Blazor는 화면을 "컴포넌트"라는 조각으로 나눠 만든다(버튼, 표의 한 줄, 페이지 전체가 모두 컴포넌트다). JavaScript 대신 C#으로 동작을 쓴다.\n컴포넌트 하나는 "어떻게 보이는지(HTML)"와 "데이터·동작(C#)"을 함께 가진다.',
       '@* Hello.razor *@\n<h1>안녕, @name</h1>\n\n@code {\n    string name = "철수";\n}\n\n→ 화면: 안녕, 철수'],
  B2: ['렌더링은 컴포넌트의 현재 값으로 HTML을 다시 만드는 것이다. 값이 바뀌어도 다시 그리지 않으면 화면은 옛 값 그대로다.\n@onclick="메서드이름"은 버튼을 눌렀을 때 그 C# 메서드를 실행하라는 뜻이다.\n문제의 핵심은 "Blazor가 언제 다시 그리는가"다.',
       '<button @onclick="Hello">누르기</button>\n\n@code {\n    void Hello() { Console.WriteLine("눌림"); }\n}'],
  B3: ['바인딩은 C# 변수와 화면을 연결하는 것이다.\n• 단방향: @name 이라고 쓰면 변수 값이 화면에 표시된다(변수 → 화면).\n• 입력칸은 반대 방향도 필요하다: 사용자가 친 글자가 변수로 들어와야 한다(화면 → 변수).',
       '<p>@name</p>                  @* 변수 → 화면 *@\n<input value="@name" />       @* 변수 → 입력칸. 입력해도 name은 안 바뀐다 *@'],
  B4: ['컴포넌트는 다른 컴포넌트 안에 넣어 쓴다(부모와 자식). 같은 자식을 내용만 바꿔 여러 번 쓰려면 부모가 값을 내려 줘야 한다.\n부모는 자식 태그에 HTML 속성처럼 값을 적는다.',
       '@* 부모 *@\n<Badge Text="신규" />\n<Badge Text="완료" />\n\n@* Badge.razor (자식) *@\n<span>@Text</span>\n@code {\n    [Parameter] public string Text { get; set; }\n}'],
  B5: ['컴포넌트는 만들어지고 → 그려지고 → 사라진다. 이 과정의 정해진 시점마다 Blazor가 불러 주는 메서드가 있다(생명주기 메서드).\n• OnInitialized / OnInitializedAsync: 처음 만들어질 때 한 번\n• OnParametersSet: 부모가 값을 넘겨줄 때마다\n• OnAfterRender: 화면에 그려진 직후\n• Dispose: 사라질 때',
       '@code {\n    string msg = "";\n    protected override void OnInitialized() { msg = "준비 완료"; }\n}'],
  B6: ['값은 부모 → 자식으로만 내려간다. 자식은 부모의 데이터를 직접 고칠 수 없다(누가 무엇을 바꿨는지 추적할 수 없게 되기 때문).\n대신 자식은 "이런 일이 일어났다"고 부모에게 알리고, 실제 처리는 데이터 주인인 부모가 한다.',
       '@* 부모: 목록의 주인 *@\n<QuoteRow Quote="q" OnDelete="Remove" />\n\n@code {\n    void Remove(int id) { /* 목록에서 지운다 */ }\n}'],
  B7: ['화면 컴포넌트가 DB 조회 코드를 직접 갖고 있으면 화면마다 같은 코드가 반복된다. 그래서 조회·저장 로직은 서비스 클래스(QuoteService)에 모으고, 컴포넌트는 그 서비스를 받아 쓴다.\n받는 방법이 의존성 주입(DI)이다: 한 곳(Program.cs)에 등록해 두면 필요한 곳에서 달라고 선언만 하면 된다.',
       '// Program.cs\nbuilder.Services.AddScoped<QuoteService>();'],
  B8: ['Blazor는 같은 컴포넌트 코드를 두 가지 방식으로 돌릴 수 있다.\n• Server: C#이 서버에서 실행된다.\n• WebAssembly: C#이 브라우저 안에서 실행된다.\n어디서 실행되느냐에 따라 DB에 바로 접근할 수 있는지, 인터넷이 끊겼을 때 어떻게 되는지가 달라진다.',
       null],
};
